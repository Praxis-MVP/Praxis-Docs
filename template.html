<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{description}}">
  <title>{{title}} - Praxis Docs</title>
  <style>
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --text: #1f2937;
      --text-light: #6b7280;
      --bg: #ffffff;
      --bg-secondary: #f9fafb;
      --border: #e5e7eb;
      --code-bg: #1e293b;
      --sidebar-width: 280px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      line-height: 1.6;
      color: var(--text);
      background: var(--bg);
    }

    /* Layout */
    .container {
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: var(--sidebar-width);
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      padding: 2rem 1rem;
      position: fixed;
      height: 100vh;
      overflow-y: auto;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary);
      text-decoration: none;
      display: block;
      margin-bottom: 2rem;
      padding: 0 0.5rem;
    }

    .nav-list {
      list-style: none;
    }

    .nav-list li {
      margin-bottom: 0.25rem;
    }

    .nav-list a {
      display: block;
      padding: 0.5rem 0.75rem;
      color: var(--text-light);
      text-decoration: none;
      border-radius: 6px;
      font-size: 0.9rem;
      transition: all 0.15s ease;
    }

    .nav-list a:hover {
      color: var(--primary);
      background: rgba(99, 102, 241, 0.1);
    }

    .nav-list li.active a {
      color: var(--primary);
      background: rgba(99, 102, 241, 0.1);
      font-weight: 500;
    }

    .nav-section-title {
      display: block;
      padding: 0.75rem 0.75rem 0.25rem;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text);
    }

    .nav-section > .nav-list {
      margin-left: 0.5rem;
    }

    /* Main content */
    .main {
      flex: 1;
      margin-left: var(--sidebar-width);
      padding: 3rem 4rem;
      max-width: 900px;
    }

    /* Typography */
    h1, h2, h3, h4, h5, h6 {
      color: var(--text);
      margin-top: 2rem;
      margin-bottom: 1rem;
      font-weight: 600;
      line-height: 1.3;
    }

    h1 { font-size: 2.25rem; margin-top: 0; }
    h2 { font-size: 1.75rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
    h3 { font-size: 1.375rem; }
    h4 { font-size: 1.125rem; }

    p {
      margin-bottom: 1rem;
    }

    a {
      color: var(--primary);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    /* Lists */
    ul, ol {
      margin-bottom: 1rem;
      padding-left: 1.5rem;
    }

    li {
      margin-bottom: 0.5rem;
    }

    /* Code */
    code {
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      font-size: 0.875em;
      background: var(--bg-secondary);
      padding: 0.2em 0.4em;
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    .code-block {
      background: var(--code-bg);
      color: #e2e8f0;
      padding: 1rem 1.25rem;
      border-radius: 8px;
      overflow-x: auto;
      margin: 1rem 0;
    }

    .code-block code {
      background: none;
      border: none;
      padding: 0;
      color: inherit;
      font-size: 0.875rem;
      line-height: 1.7;
    }

    /* Tables */
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 1rem 0;
    }

    th, td {
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      text-align: left;
    }

    th {
      background: var(--bg-secondary);
      font-weight: 600;
    }

    /* Callouts */
    .callout {
      padding: 1rem 1.25rem;
      border-radius: 8px;
      margin: 1rem 0;
      border-left: 4px solid;
    }

    .callout-note {
      background: #eff6ff;
      border-color: #3b82f6;
    }

    .callout-warning {
      background: #fffbeb;
      border-color: #f59e0b;
    }

    .callout-error {
      background: #fef2f2;
      border-color: #ef4444;
    }

    .callout-success {
      background: #f0fdf4;
      border-color: #22c55e;
    }

    /* Blockquote */
    blockquote {
      border-left: 4px solid var(--border);
      padding-left: 1rem;
      margin: 1rem 0;
      color: var(--text-light);
      font-style: italic;
    }

    /* Images */
    img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      margin: 1rem 0;
    }

    /* Horizontal rule */
    hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 2rem 0;
    }

    /* Mobile */
    @media (max-width: 768px) {
      .sidebar {
        position: relative;
        width: 100%;
        height: auto;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }

      .container {
        flex-direction: column;
      }

      .main {
        margin-left: 0;
        padding: 2rem 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <aside class="sidebar">
      <a href="/" class="logo">Praxis Docs</a>
      <nav>
        {{navigation}}
      </nav>
    </aside>
    <main class="main">
      {{content}}
    </main>
  </div>
</body>
</html>
